# Free-tier budget for dial. `estimate_at_1000_users_per_day` is the number
# the brief and the G3 launch packet quote; `ceiling` is the platform's actual
# free-tier limit. The launch quota dry-run fails once any estimate crosses
# `alert_at` of its ceiling. Workers requests and D1 rows written are quotas of
# the whole Cloudflare account, shared by every product on it, not per product.
alert_at: 0.7

quotas:
  - name: workers_requests_per_day
    ceiling: 100000
    estimate_at_1000_users_per_day: 5000
    notes: "Account-wide. ~5 Worker requests per visitor a day: /e events (a page view, a work_opened for each station chosen on the dial, at most 3 a page load, and a chapter_rendered when a work is finished) and occasional /feedback. Static pages, scripts, styles and fonts are served by Workers Static Assets without invoking the Worker (wrangler.jsonc's run_worker_first lists only the Worker routes), so they do not count here. Not bounded against abuse on the free plan: a refused request is still an invocation. The zone's WAF rule caps bursts (the /release skill), and the rest is an accepted risk signed at G3 (the /launch skill)."

  - name: static_asset_largest_file_mib
    ceiling: 25
    estimate_at_1000_users_per_day: 20.6
    notes: "Workers Static Assets serves files up to 25 MiB and is free and unmetered. The voice model (92 MB) ships in 20 MiB parts (scripts/fetch-voice.mjs); the largest file is onnxruntime-web's 20.6 MiB WASM. A listener who makes a work on their device downloads about 115 MB once, then it lives in their browser's cache storage. Dial's prepared recordings (T5) are static files too: Opus parts of about a minute (under 1 MiB each, about 7 MB for the Cave), fetched as they play. Neither path invokes the Worker or touches D1, so no metered cost scales with listening."

  - name: d1_rows_read_per_day
    ceiling: 5000000
    estimate_at_1000_users_per_day: 20000
    notes: "Each counted request reads its counter row; /healthz and the rate-limit check do not touch D1."

  - name: d1_rows_written_per_day
    ceiling: 100000
    estimate_at_1000_users_per_day: 5000
    worst_case_rows: 14105
    worst_case_max_share: 0.15
    notes: "Account-wide. Typical is ~5,000 (one counter update per /e call, occasional feedback). Every write path sits behind a day ceiling that writes nothing once reached, so this product's writes are bounded by the sum of ceiling x rows-per-count, index entries included (worker/src/config.ts's worstCaseDailyWrites, with wrangler.jsonc's values): /e client events (page_view, work_opened, chapter_rendered) 3 x (3,500 + 1 + a daily feedback purge of up to 2 x the 100-row feedback ceiling, 2 rows each) = 11,703; feedback 100 x 22 + 101 = 2,301; rate_limiter_error 101. Worst case 14,105 rows, 14.1% of the account's 100,000; worst_case_max_share caps it at 15%, so four live products at their caps stay under the 70% alert together. tests/hardening.test.ts recomputes worst_case_rows from wrangler.jsonc and checks the share. Refused requests (rate limit, cross-site, content type, ceilings) write nothing."

  - name: d1_storage_mb
    ceiling: 500
    estimate_at_1000_users_per_day: 40
    notes: "D1's free tier caps one database at 500 MB. Feedback is bounded at ~39 MB (FEEDBACK_DAILY_CEILING 100/day x 90-day retention purged before every insert = 9,000 rows x at most 4,000 B of text + 256 B of page + overhead); event_counts is well under 1 MB a year."

  - name: kv_writes_per_day
    ceiling: 1000
    estimate_at_1000_users_per_day: 0
    notes: "No KV writes in v1; reserved for config."

  - name: r2_storage_gb
    ceiling: 10
    estimate_at_1000_users_per_day: 0
    notes: "No blob storage in v1."

  - name: github_actions_minutes_per_month
    ceiling: 2000
    estimate_at_1000_users_per_day: 60
    notes: "gate on every PR/push, verify-production every 6 hours, weekly branch-prune."
