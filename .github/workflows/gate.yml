name: gate

on:
  pull_request:
  push:
    branches: [main]

# The gate only reads the repository (T11, L2).
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs, the version named beside each (scripts/lint-workflows.mjs).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      # The prepared recordings, pinned by recordings.lock.json, are downloaded once per lock (scripts/fetch-recordings.mjs checks every byte).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/recordings
          key: recordings-${{ hashFiles('recordings.lock.json') }}
      # The voice models (q8, and fp32 for the graphics chip), pinned in scripts/fetch-voice.mjs, are downloaded once per pin set (every byte is checked).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/kokoro
          key: kokoro-${{ hashFiles('scripts/fetch-voice.mjs') }}
      # Exactly the lockfile's versions, never a fresh resolve.
      - run: npm ci
      # The layout check (a gate step) drives Chromium through the panel map; CI never skips it.
      - run: npx playwright install --with-deps chromium
      - run: npm run gate
