# The served-page contract. scripts/contract.mjs runs every check in `checks`
# against `url` (or the URL passed to `--url`) and exits non-zero if any fail.
# A check tagged `requires: deployed` needs the Cloudflare runtime and is
# reported as SKIP against a localhost URL; it must PASS on the preview.
# `events.allowed` and `events.server_only` are the source of truth that
# worker/src/config.ts mirrors; tests/contract-events.test.ts keeps them in
# sync.
url: https://dial.voidvision.org
# Bursts measure the Worker's own limit. On the production domain the zone's
# WAF rule (30 per 10 s per IP) blocks a burst first with its own 1015 page, so
# a burst aimed at a host under `burst_zone` goes to `burst_host` instead: the
# same deployment's workers.dev address, which the zone's rules do not cover.
# The runner first requires burst_host's /healthz build to equal production's.
# workers_dev must stay on (wrangler.jsonc): that address bypasses the zone's
# WAF for anyone, which is acceptable only because the Worker's own limit runs
# first on every request, and that limit is exactly what these bursts prove.
# The zone's WAF rule itself is confirmed by hand at /release (zone_waf_rule).
burst_zone: voidvision.org
burst_host: https://dial.aacrit.workers.dev

checks:
  - name: homepage status 200
    type: status
    path: /
    expect: 200

  - name: homepage names the product
    type: contains
    path: /
    text: "Dial"

  - name: homepage carries a build marker
    type: meta
    path: /
    meta_name: build

  - name: privacy page responds
    type: status
    path: /privacy
    expect: 200

  # T8: the Seal is a widget on the radio (design/spec.md 00), and /seal is
  # gone. A 404, not a redirect: there is no page to send anyone to, and a
  # bare 404 needs no _redirects rule for Workers Static Assets to keep
  # (not_found_handling stays "none"). The widget's own words are on the
  # radio's page instead.
  - name: the Seal page is gone
    type: status
    path: /seal
    expect: 404

  - name: the radio carries the Seal widget
    type: contains
    path: /
    text: "Seal"

  - name: the Seal widget has the counts switch
    type: contains
    path: /
    text: "Send anonymous counts"

  - name: the Seal widget lists every request, collapsed
    type: contains
    path: /
    text: "Show every request"

  - name: a work's Broadcast carries the Seal widget too
    type: contains
    path: /play/crito
    text: "Send anonymous counts"

  - name: healthz responds
    type: status
    path: /healthz
    expect: 200

  - name: healthz reports ok
    type: json
    path: /healthz
    field: ok
    expect: true

  - name: homepage has no leftover placeholders
    type: forbidden
    path: /
    strings:
      - "undefined"
      - "NaN"
      - "lorem"
      - "TODO"
      - "__"
      - "core_success_event"

  - name: homepage carries no anonymous-id telemetry
    type: forbidden
    path: /
    strings:
      - "anon-id"
      - "localStorage.setItem(\"anon"

  - name: homepage loads nothing from a font CDN
    type: forbidden
    path: /
    strings:
      - "fonts.googleapis.com"
      - "fonts.gstatic.com"

  # The one unit of value: the Cave, and everything the tab needs to
  # render it, served from this origin (Law 1).
  - name: the Cave's text is served
    type: contains
    path: /works/cave.txt
    text: "And now, I said, let me show in a figure"

  - name: the Cave's text ends at 521b
    type: contains
    path: /works/cave.txt
    text: "They are the men, and I will choose them, he replied."

  # T2: the radio's three stations. The homepage is the Repertory, and
  # every station's text is served from this origin.
  - name: homepage is the Repertory
    type: contains
    path: /
    text: "The Repertory"

  - name: Crito's text is served
    type: contains
    path: /works/crito.txt
    text: "Why have you come at this hour, Crito?"

  - name: Crito's text ends at the dialogue's last words
    type: contains
    path: /works/crito.txt
    text: "whither he leads."

  - name: the Meditations' Book II is served
    type: contains
    path: /works/meditations.txt
    text: "Begin the morning by saying to thyself"

  - name: the Meditations' Book II ends at Carnuntum
    type: contains
    path: /works/meditations.txt
    text: "This in Carnuntum."

  # T3: each work's Broadcast is a real page at /play/<slug>, so a reload
  # or a shared link opens it (dist/play/<slug>.html, web/vite.config.ts).
  - name: the Cave's Broadcast is served
    type: status
    path: /play/cave
    expect: 200

  - name: the Cave's Broadcast names the work
    type: contains
    path: /play/cave
    text: "<title>The Allegory of the Cave · Dial</title>"

  - name: Crito's Broadcast is served
    type: status
    path: /play/crito
    expect: 200

  - name: Crito's Broadcast names the work
    type: contains
    path: /play/crito
    text: "<title>Crito · Dial</title>"

  - name: Crito's Broadcast carries a build marker
    type: meta
    path: /play/crito
    meta_name: build

  - name: the Meditations' Broadcast is served
    type: status
    path: /play/meditations
    expect: 200

  - name: the Meditations' Broadcast names the work
    type: contains
    path: /play/meditations
    text: "<title>Meditations, Book II · Dial</title>"

  - name: the voice manifest is served
    type: status
    path: /voice/manifest.json
    expect: 200

  # Every voice file the manifest pins (scripts/fetch-voice.mjs VOICES; the
  # cast in web/src/engine/cast.ts): tests/speakers.test.ts keeps the two lists equal.
  - name: the voice am_michael is served
    type: status
    path: /voice/voices/am_michael.bin
    expect: 200

  - name: the voice af_heart is served
    type: status
    path: /voice/voices/af_heart.bin
    expect: 200

  - name: the voice am_fenrir is served
    type: status
    path: /voice/voices/am_fenrir.bin
    expect: 200

  - name: the voice am_puck is served
    type: status
    path: /voice/voices/am_puck.bin
    expect: 200

  - name: the voice's first model part is served
    type: status
    path: /voice/models/onnx-community/Kokoro-82M-v1.0-ONNX/onnx/model_quantized.part0
    expect: 200

  - name: the WASM runtime is served
    type: status
    path: /ort/ort-wasm-simd-threaded.jsep.mjs
    expect: 200

  # T5: Dial's prepared recordings, staged from recordings.lock.json by
  # scripts/fetch-recordings.mjs: each work's list entry, timing index and
  # first part (tests/recordings.test.ts keeps these in step with the lock).
  # T5b: the same first part in m4a (AAC-LC), for iPhone and desktop Safari.
  - name: the prepared recordings' list is served
    type: status
    path: /recordings/manifest.json
    expect: 200

  - name: the Cave's prepared recording index is served
    type: status
    path: /recordings/cave/index.json
    expect: 200

  - name: the Cave's prepared recording, part 0, is served
    type: status
    path: /recordings/cave/part0.webm
    expect: 200

  - name: the Cave's prepared recording, part 0 in m4a, is served
    type: status
    path: /recordings/cave/part0.m4a
    expect: 200

  - name: Crito's prepared recording index is served
    type: status
    path: /recordings/crito/index.json
    expect: 200

  - name: Crito's prepared recording, part 0, is served
    type: status
    path: /recordings/crito/part0.webm
    expect: 200

  - name: Crito's prepared recording, part 0 in m4a, is served
    type: status
    path: /recordings/crito/part0.m4a
    expect: 200

  - name: the Meditations' prepared recording index is served
    type: status
    path: /recordings/meditations/index.json
    expect: 200

  - name: the Meditations' prepared recording, part 0, is served
    type: status
    path: /recordings/meditations/part0.webm
    expect: 200

  - name: the Meditations' prepared recording, part 0 in m4a, is served
    type: status
    path: /recordings/meditations/part0.m4a
    expect: 200

  # T4: the installable app and the offline helper (web/src/sw.ts, built
  # to dist/sw.js), both static files from this origin.
  - name: the app manifest is served
    type: status
    path: /manifest.webmanifest
    expect: 200

  - name: the app manifest names Dial
    type: contains
    path: /manifest.webmanifest
    text: "\"short_name\": \"Dial\""

  - name: the app icon is served
    type: status
    path: /icons/dial-192.png
    expect: 200

  - name: the offline helper is served
    type: status
    path: /sw.js
    expect: 200

  - name: the offline helper served is the built one (it names the routes it leaves alone)
    type: contains
    path: /sw.js
    text: "/feedback"

  - name: homepage is cross-origin isolated (threaded render)
    type: header
    path: /
    header: cross-origin-embedder-policy
    expect: require-corp

  # Headers a <meta> tag cannot carry. Static pages get them from
  # dist/_headers (scripts/build.mjs), Worker responses from
  # worker/src/headers.ts.
  - name: homepage cannot be framed (CSP)
    type: header
    path: /
    header: content-security-policy
    contains: "frame-ancestors 'none'"

  - name: homepage cannot be framed (X-Frame-Options)
    type: header
    path: /
    header: x-frame-options
    expect: DENY

  - name: homepage is not content-sniffed
    type: header
    path: /
    header: x-content-type-options
    expect: nosniff

  - name: homepage sends no referrer
    type: header
    path: /
    header: referrer-policy
    expect: no-referrer

  - name: homepage loads fonts from its own origin only
    type: header
    path: /
    header: content-security-policy
    contains: "font-src 'self'"

  - name: healthz carries the API policy
    type: header
    path: /healthz
    header: content-security-policy
    expect: "default-src 'none'; frame-ancestors 'none'"

  - name: healthz cannot be framed (X-Frame-Options)
    type: header
    path: /healthz
    header: x-frame-options
    expect: DENY

  # HTTPS only once seen over HTTPS (the redirect from http:// is the
  # zone's "Always Use HTTPS" setting), and no device feature for anyone
  # (scripts/lib/csp.mjs SECURITY_HEADERS). Pages and the Worker alike.
  - name: homepage is HTTPS only (HSTS)
    type: header
    path: /
    header: strict-transport-security
    expect: "max-age=31536000"

  - name: healthz is HTTPS only (HSTS)
    type: header
    path: /healthz
    header: strict-transport-security
    expect: "max-age=31536000"

  - name: homepage allows no camera, microphone, location or USB
    type: header
    path: /
    header: permissions-policy
    expect: "camera=(), microphone=(), geolocation=(), usb=()"

  # http:// answers 301 to https:// (CoS decision I). The redirect is the
  # zone's "Always Use HTTPS" setting, not the Worker's, so this fails until
  # the founder switches it on; G3 requires it. Only the zone's own host
  # can pass it: on a workers.dev preview (outside the zone) or localhost
  # the runner reports it "n/a (production host only)", neither passed nor
  # skipped.
  - name: http:// redirects to https:// (production host only)
    type: redirect
    path: /
    scheme: http
    expect: 301
    location_starts_with: "https://"
    host_suffix: voidvision.org
    requires: deployed
    failure_note: "Waiting on the founder: switch on Always Use HTTPS for the voidvision.org zone (the open Board ask). G3 requires this check."

  - name: healthz allows no camera, microphone, location or USB
    type: header
    path: /healthz
    header: permissions-policy
    expect: "camera=(), microphone=(), geolocation=(), usb=()"

  # Every file the offline helper keeps (dist/offline-shell.json, the list
  # compiled into /sw.js) is served. Waits out the zone WAF's 10 s window
  # first, since the pages and icons are outside /assets/.
  - name: every offline shell file is served
    type: each_status
    path: /offline-shell.json
    expect: 200
    pause_before_seconds: 11

  # The per-client rate limit actually bites. The Workers Rate Limiting
  # binding only counts on Cloudflare, so this runs against the preview and
  # production only. It must be the Worker's own refusal, not a WAF 1015
  # page (also a 429), and it waits out the WAF's 10 s window first. The
  # binding counts permissively, so the burst goes 20 at a time: 25
  # sequential requests never tripped it (Dial's Spark release, 2026-09-26).
  - name: rate limit bites on the Worker (deployed only)
    type: burst
    path: /healthz
    count: 80
    concurrency: 20
    expect_status: 429
    expect_error: rate_limited
    pause_before_seconds: 11
    requires: deployed

  # The write paths' own limits (worker/src/guard.ts RL_EVENTS, 6 a minute,
  # and RL_FEEDBACK, 2 a minute). Each burst posts a body validation
  # refuses (400) until the limit bites, so it writes no count and stores
  # no message. Small waves stay under the WAF's 30 per 10 s.
  - name: /e has its own tighter limit (deployed only)
    type: burst
    path: /e
    method: POST
    body: { name: "not_an_event" }
    count: 20
    concurrency: 10
    expect_status: 429
    expect_error: rate_limited
    pause_before_seconds: 11
    requires: deployed

  - name: /feedback has its own tighter limit (deployed only)
    type: burst
    path: /feedback
    method: POST
    body: { text: "" }
    count: 12
    concurrency: 6
    expect_status: 429
    expect_error: rate_limited
    pause_before_seconds: 11
    requires: deployed

# The zone's one free WAF rate-limiting rule, shared by every product on
# voidvision.org. Not a check: the /release skill confirms the live rule
# matches this before a release, and web/privacy.html discloses what it logs
# (tests/privacy-page.test.ts pairs the two). Blocked requests are recorded
# in Cloudflare's Security Events with IP, path and user agent.
zone_waf_rule:
  name: voidvision worker invocations
  expression: '(not http.request.uri.path wildcard "/assets/*" and not cf.client.bot)'
  characteristic: ip
  requests: 30
  period_seconds: 10
  action: block
  mitigation_timeout_seconds: 10
  logs_blocked_requests: [ip, path, user_agent]

events:
  allowed:
    - page_view
    # A station chosen on the dial at /, once per station per page load
    # (web/src/main.ts).
    - work_opened
    # A listen heard to four fifths of its length, on either path: Dial's
    # prepared recording or made in the tab (web/src/main.ts; CoS decision A).
    - chapter_rendered
    - feedback_received
    - rate_limiter_error
  # Counted only by the Worker code that does the thing being counted; /e
  # rejects them, so a client cannot inflate them or exhaust their ceilings.
  server_only:
    - feedback_received
    - rate_limiter_error

# The one event the kill criteria in CHARTER.md count. It must be the
# product's core action completing (an export, an order, a finished task),
# never page views or feedback.
success_event: chapter_rendered
